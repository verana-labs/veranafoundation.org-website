<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- Verana Foundation mark for credentials: the favicon mark centred on a
       white square with a 10% margin, so wallets that round the corners do
       not cut the mark. A new version takes a new file name: credentials
       carry a digest of their logo, so an issued logo file never changes. -->
  <rect width="100" height="100" fill="#FFFFFF"/>
  <g transform="translate(10 11.48) scale(1.4815)">
    <path fill="#763EF0" d="M26.9932 51.6972L5.805 11.0977L2.91263 16.2161L0 10.6048L5.98725 0L26.9932 40.2483L47.9993 0L54 10.6217L51.0773 16.2161L48.1849 11.0977L26.9932 51.6972Z"/>
    <path fill="#1FB57A" d="M13.696 0L26.9935 25.4637L39.9367 0H13.696Z"/>
  </g>
</svg>
