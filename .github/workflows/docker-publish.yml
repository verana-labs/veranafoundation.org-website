name: CI / Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  DOCKER_HUB_NAMESPACE: veranalabs
  IMAGE_NAME: veranafoundation.org-website

jobs:
  # ---------------------------------------------------------------------------
  # Build + type-check on every push and PR.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Build + push the Docker image to Docker Hub on pushes to main and tags.
  # ---------------------------------------------------------------------------
  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PWD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (app)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (migrator)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migrator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:migrate
          cache-from: type=gha

  # ---------------------------------------------------------------------------
  # Deploy to Kubernetes (OVH) on push to main only.
  # ---------------------------------------------------------------------------
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy
        env:
          KUBECONFIG_DATA: ${{ secrets.OVH_KUBECONFIG }}
          # All values come from GitHub Actions secrets — nothing in cleartext.
          RELATICLE_API_TOKEN: ${{ secrets.RELATICLE_API_TOKEN }}
          # Postgres password must match the password embedded in DATABASE_URL.
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          echo "$KUBECONFIG_DATA" > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          # Upsert the app secret from GitHub Actions secrets. Idempotent:
          # re-applied on every deploy. Empty values are simply blank keys.
          kubectl -n web create secret generic veranafoundation-website-secrets \
            --from-literal=RELATICLE_API_TOKEN="${RELATICLE_API_TOKEN}" \
            --from-literal=POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            --from-literal=DATABASE_URL="${DATABASE_URL}" \
            --from-literal=AUTH_SECRET="${AUTH_SECRET}" \
            --from-literal=AUTH_GOOGLE_ID="${AUTH_GOOGLE_ID}" \
            --from-literal=AUTH_GOOGLE_SECRET="${AUTH_GOOGLE_SECRET}" \
            --from-literal=AUTH_GITHUB_ID="${AUTH_GITHUB_ID}" \
            --from-literal=AUTH_GITHUB_SECRET="${AUTH_GITHUB_SECRET}" \
            --from-literal=RESEND_API_KEY="${RESEND_API_KEY}" \
            --from-literal=STRIPE_SECRET_KEY="${STRIPE_SECRET_KEY}" \
            --from-literal=STRIPE_WEBHOOK_SECRET="${STRIPE_WEBHOOK_SECRET}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/
          # Wait for Postgres, then apply DB migrations as a one-off Job before
          # the app rollout (Jobs are immutable, so delete + recreate each deploy).
          kubectl -n web rollout status statefulset/postgres --timeout=180s
          kubectl -n web delete job db-migrate --ignore-not-found
          kubectl -n web apply -f ci/migrate-job.yaml
          kubectl -n web wait --for=condition=complete job/db-migrate --timeout=180s \
            || { echo "migration failed:"; kubectl -n web logs job/db-migrate; exit 1; }
          # imagePullPolicy: Always + restart => new pods repull the :latest tag.
          kubectl rollout restart deployment/veranafoundation-website -n web
          kubectl rollout status deployment/veranafoundation-website -n web --timeout=120s
