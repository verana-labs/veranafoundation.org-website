# Seed Job — ensures the bootstrap admin allowlist (ADMIN_BOOTSTRAP_EMAILS).
# CI runs this automatically on every deploy (after migrations). Idempotent
# (upsert): it guarantees those emails are admins and never removes admins added
# later in /admin/admins. ADMIN_BOOTSTRAP_EMAILS comes from the cluster Secret
# (set the GitHub Actions secret of the same name).
#
# Can also be run manually:
#   kubectl -n web delete job seed --ignore-not-found
#   kubectl -n web apply -f ci/seed-job.yaml
#   kubectl -n web wait --for=condition=complete job/seed --timeout=120s
#   kubectl -n web logs job/seed
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: web
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: veranalabs/veranafoundation.org-website:migrate
          imagePullPolicy: Always
          command: ["node", "prisma/seed.mjs"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: DATABASE_URL
            # Comma-separated admin emails — from the cluster Secret.
            - name: ADMIN_BOOTSTRAP_EMAILS
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: ADMIN_BOOTSTRAP_EMAILS
                  optional: true
            # Optional: which legal/ version file to activate as the Membership
            # Agreement (defaults to membership-agreement-v1.md).
            # - name: AGREEMENT_FILENAME
            #   value: "membership-agreement-v1.md"
