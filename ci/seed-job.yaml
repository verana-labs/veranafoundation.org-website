# Seed Job — ensures the bootstrap admin allowlist (ADMIN_BOOTSTRAP_EMAILS) and
# bootstraps the Membership Agreement catalog. CI runs this automatically on
# every deploy (after migrations). Idempotent (upsert): it guarantees those
# emails are admins and never removes admins added later in /admin/admins, and
# it keeps whichever agreement version an admin activated in /admin/settings
# (it only activates the default v1 when no version is active yet).
# ADMIN_BOOTSTRAP_EMAILS comes from the cluster Secret (set the GitHub Actions
# secret of the same name).
#
# Can also be run manually:
#   kubectl -n web delete job seed --ignore-not-found
#   kubectl -n web apply -f ci/seed-job.yaml
#   kubectl -n web wait --for=condition=complete job/seed --timeout=120s
#   kubectl -n web logs job/seed
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: web
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: veranalabs/veranafoundation.org-website:migrate
          imagePullPolicy: Always
          command: ["node", "prisma/seed.mjs"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: DATABASE_URL
            # Comma-separated admin emails — from the cluster Secret.
            - name: ADMIN_BOOTSTRAP_EMAILS
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: ADMIN_BOOTSTRAP_EMAILS
                  optional: true
            # Optional override: force this legal/ version file to be the active
            # Membership Agreement on every deploy, even if an admin activated
            # another one. Leave unset so admin choices in /admin/settings stick
            # (the seed then only bootstraps membership-agreement-v1.md when no
            # version is active).
            # - name: AGREEMENT_FILENAME
            #   value: "membership-agreement-v5.md"
