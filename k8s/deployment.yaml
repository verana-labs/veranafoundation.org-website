apiVersion: apps/v1
kind: Deployment
metadata:
  name: veranafoundation-website
  namespace: web
  labels:
    app.kubernetes.io/name: veranafoundation-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: veranafoundation-website
  template:
    metadata:
      labels:
        app.kubernetes.io/name: veranafoundation-website
    spec:
      containers:
        - name: veranafoundation-website
          # Mutable tag; paired with imagePullPolicy: Always so a
          # `kubectl rollout restart` in CI always repulls the newest build.
          image: veranalabs/veranafoundation.org-website:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
            # Relaticle CRM (in-cluster). The contact form posts inquiries here.
            - name: RELATICLE_API_URL
              value: http://relaticle.relaticle.svc.cluster.local
            - name: RELATICLE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: RELATICLE_API_TOKEN
                  # Optional so the pod still starts if the secret is absent;
                  # the contact route degrades to best-effort (logs only).
                  optional: true
            # ── Membership / billing / accounts ──────────────────────────────
            # Secrets come from veranafoundation-website-secrets (CI-injected
            # from GitHub Actions secrets). optional:true keeps the pod bootable
            # before a secret exists; DATABASE_URL becomes required once Phase 1
            # code reads the DB.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: DATABASE_URL
                  optional: true
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: AUTH_SECRET
                  optional: true
            - name: AUTH_URL
              value: https://veranafoundation.org
            - name: AUTH_GOOGLE_ID
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: AUTH_GOOGLE_ID
                  optional: true
            - name: AUTH_GOOGLE_SECRET
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: AUTH_GOOGLE_SECRET
                  optional: true
            - name: AUTH_GITHUB_ID
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: AUTH_GITHUB_ID
                  optional: true
            - name: AUTH_GITHUB_SECRET
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: AUTH_GITHUB_SECRET
                  optional: true
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: RESEND_API_KEY
                  optional: true
            - name: EMAIL_FROM
              value: no-reply@veranafoundation.org
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: STRIPE_SECRET_KEY
                  optional: true
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: STRIPE_WEBHOOK_SECRET
                  optional: true
            # Invoicing config — non-sensitive, plain values. VAT_DOMESTIC_RATE:
            # CONFIRM the Estonian rate + 2060 OÜ VAT registration with the accountant.
            - name: SELLER_LEGAL_NAME
              value: "Verana Foundation (in formation), represented by 2060 OÜ"
            - name: SELLER_COUNTRY
              value: EE
            - name: INVOICE_PREFIX
              value: "VF-"
            - name: VAT_DOMESTIC_RATE
              value: "0.24"
            # Sensitive/org-specific — injected from GitHub Actions secrets.
            - name: SELLER_VAT_NUMBER
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: SELLER_VAT_NUMBER
                  optional: true
            - name: BANK_TRANSFER_DETAILS
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: BANK_TRANSFER_DETAILS
                  optional: true
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
