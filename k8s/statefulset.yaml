# StatefulSet (not Deployment) because the pod owns a ReadWriteOnce data volume
# (signed agreement PDFs, future org logos). On OVH (Cinder RWO) a volume mounts
# to one node at a time; the StatefulSet's per-ordinal PVC + delete-before-create
# rollout guarantees a single mounter, where a Deployment's RollingUpdate would
# spin up a second pod and deadlock on the mount.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: veranafoundation-website
  namespace: web
  labels:
    app.kubernetes.io/name: veranafoundation-website
spec:
  replicas: 1
  serviceName: veranafoundation-website
  selector:
    matchLabels:
      app.kubernetes.io/name: veranafoundation-website
  template:
    metadata:
      labels:
        app.kubernetes.io/name: veranafoundation-website
    spec:
      # The app runs as uid 1001 (`nextjs`, Dockerfile) but a fresh PVC mounts
      # root-owned, so every write under /data failed EACCES (signed-agreement
      # PDFs, logos). fsGroup makes kubelet chown the volume to the app's group
      # on mount; OnRootMismatch skips the walk once ownership is right.
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: veranafoundation-website
          # Mutable tag; paired with imagePullPolicy: Always so a
          # `kubectl rollout restart` in CI always repulls the newest build.
          image: veranalabs/veranafoundation.org-website:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
            # Persistent volume for member-generated files (signed agreement
            # PDFs today, org logos later). Mounted from the data PVC below.
            - name: STORAGE_DIR
              value: /data
            # Relaticle CRM (in-cluster). The contact form posts inquiries here.
            - name: RELATICLE_API_URL
              value: http://relaticle.relaticle.svc.cluster.local
            - name: RELATICLE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: RELATICLE_API_TOKEN
                  # Optional so the pod still starts if the secret is absent;
                  # the contact route degrades to best-effort (logs only).
                  optional: true
            # ── Membership / billing / accounts ──────────────────────────────
            # Secrets come from veranafoundation-website-secrets (CI-injected
            # from GitHub Actions secrets). optional:true keeps the pod bootable
            # before a secret exists; DATABASE_URL becomes required once Phase 1
            # code reads the DB.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: DATABASE_URL
                  optional: true
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: AUTH_SECRET
                  optional: true
            - name: AUTH_URL
              value: https://veranafoundation.org
            - name: AUTH_GOOGLE_ID
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: AUTH_GOOGLE_ID
                  optional: true
            - name: AUTH_GOOGLE_SECRET
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: AUTH_GOOGLE_SECRET
                  optional: true
            - name: AUTH_GITHUB_ID
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: AUTH_GITHUB_ID
                  optional: true
            - name: AUTH_GITHUB_SECRET
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: AUTH_GITHUB_SECRET
                  optional: true
            # SMTP — host/port + from are plain; username + app password are secrets.
            - name: MAIL_HOST
              value: smtp.gmail.com
            - name: MAIL_PORT
              value: "587"
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: MAIL_USERNAME
                  optional: true
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: MAIL_PASSWORD
                  optional: true
            - name: MAIL_FROM_ADDRESS
              value: no-reply@veranafoundation.org
            - name: MAIL_FROM_NAME
              value: Verana Foundation
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: STRIPE_SECRET_KEY
                  optional: true
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: STRIPE_WEBHOOK_SECRET
                  optional: true
            # Invoicing config — non-sensitive, plain values. VAT_DOMESTIC_RATE:
            # CONFIRM the Estonian rate + 2060 OÜ VAT registration with the accountant.
            - name: SELLER_LEGAL_NAME
              value: "Verana Foundation (2060 OÜ)"
            - name: SELLER_COUNTRY
              value: EE
            - name: INVOICE_PREFIX
              value: "VF-"
            - name: VAT_DOMESTIC_RATE
              value: "0.24"
            # Sensitive/org-specific — injected from GitHub Actions secrets.
            - name: SELLER_VAT_NUMBER
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: SELLER_VAT_NUMBER
                  optional: true
            - name: BANK_TRANSFER_DETAILS
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: BANK_TRANSFER_DETAILS
                  optional: true
            # Wise auto-reconciliation of direct wires (read-only API) + the
            # cron backstop. All optional: without them /api/webhooks/wise
            # answers 503 and reconciliation simply stays off.
            - name: WISE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: WISE_API_TOKEN
                  optional: true
            - name: WISE_PROFILE_ID
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: WISE_PROFILE_ID
                  optional: true
            - name: WISE_WEBHOOK_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: WISE_WEBHOOK_PUBLIC_KEY
                  optional: true
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: CRON_SECRET
                  optional: true
            # Working groups (ADR-0003): Google Calendar sync (service account
            # with domain-wide delegation impersonating the meetings@ role
            # account) + the public minutes repository. All optional: schedules
            # save with a visible "not configured" notice and minutes stay
            # drafts until these exist.
            - name: GOOGLE_SA_EMAIL
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: GOOGLE_SA_EMAIL
                  optional: true
            - name: GOOGLE_SA_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: GOOGLE_SA_PRIVATE_KEY
                  optional: true
            - name: GOOGLE_CALENDAR_IMPERSONATE
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: GOOGLE_CALENDAR_IMPERSONATE
                  optional: true
            - name: MINUTES_REPO
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: MINUTES_REPO
                  optional: true
            - name: MINUTES_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: veranafoundation-website-secrets
                  key: MINUTES_GITHUB_TOKEN
                  optional: true
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
  # Per-pod persistent storage for member-generated files (signed agreement
  # PDFs, future org logos). RWO: only ever mounted by this single replica.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
